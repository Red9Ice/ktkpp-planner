name: Запуск Solver расписания колледжа

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим работы решателя (full / repair / incremental)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - repair
          - incremental
      time_limit:
        description: 'Максимальное время расчета в секундах'
        required: false
        default: '600'
        type: string

jobs:
  solve-timetable:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка среды Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка зависимостей проекта
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск математического решателя расписания
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOLVER_MAX_TIME_SECONDS: ${{ inputs.time_limit }}
          SOLVER_NUM_WORKERS: 4
        run: |
          python -m src.solver.runner --mode ${{ inputs.mode }} --time-limit ${{ inputs.time_limit }}

      - name: Выгрузка файла Excel с расписанием в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: college-timetable-excel
          path: College_Timetable.xlsx
          retention-days: 14
